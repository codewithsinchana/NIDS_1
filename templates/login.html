<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIDS · Sign in</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0e1a;color:#e6e9f2;font-family:Inter,system-ui,sans-serif}
.box{width:min(380px,92vw);background:#111728;border:1px solid #1e2740;border-radius:12px;padding:32px}
h1{margin:0 0 4px;font-size:22px}p{margin:0 0 22px;color:#8791ad;font-size:14px}
label{display:block;font-size:13px;color:#aab3cc;margin:14px 0 6px}
input{width:100%;padding:11px 12px;background:#0a0e1a;border:1px solid #26314f;border-radius:8px;color:#fff;font-size:14px}
input:focus{outline:2px solid #2f6bff;border-color:transparent}
button{width:100%;margin-top:22px;padding:12px;background:#2f6bff;color:#fff;border:0;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
.err{background:#3a1520;color:#ff8a9b;padding:10px;border-radius:8px;font-size:13px;margin-bottom:6px}.hint{margin-top:16px;font-size:12px;color:#6b7592}
</style></head><body><form class="box" method="post">
<h1>Network Intrusion Detection System</h1><p>Sign in to view live alerts and traffic.</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<label for="u">Username</label><input id="u" name="username" required autofocus>
<label for="p">Password</label><input id="p" name="password" type="password" required>
<button>Sign in</button><div class="hint">Admin: admin / admin123 · Analyst (read-only): analyst / analyst123</div></form></body></html>
